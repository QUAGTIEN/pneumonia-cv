; Firmware cho ESP32-WROOM-32D (4 MB Flash, khong PSRAM).
; Dung cac file .bat o thu muc goc du an: verify.bat / upload.bat / monitor.bat

[env:esp32d]
platform = espressif32
board = esp32dev
framework = arduino
; Cong USB cua board (xem bang: pio device list). Doi neu may nhan cong khac.
upload_port = COM3
monitor_port = COM3
; 921600: truyen anh nhanh (log khoi dong cua chip o 115200 se hien vai ky tu rac - binh thuong)
monitor_speed = 921600
monitor_filters = esp32_exception_decoder
; huge_app: 3 MB cho chuong trinh (model 630 KB + WiFi + trang web)
board_build.partitions = huge_app.csv
lib_deps =
    spaziochirale/Chirale_TensorFLowLite@^2.0.0
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=1
